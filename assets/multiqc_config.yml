report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/clipseq/tree/dev" target="_blank">nf-core/clipseq</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/clipseq/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-clipseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-clipseq-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# Run only these modules
run_modules:
  - custom_content
  - fastqc
  - cutadapt
  - bowtie1
  - star

module_order:
  - fastqc:
      name: "FastQC (raw)"
      anchor: "fastqc_raw"
      info: "This section of the report shows FastQC results before adapter trimming."
      path_filters:
        - "*_fastqc.zip"
      path_filters_exclude:
        - "*_trimmed_fastqc.zip"
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: "fastqc_trimmed"
      info: "This section of the report shows FastQC results after adapter trimming."
      genome: ""
      path_filters:
        - "*_trimmed_fastqc.zip"
  - bowtie1:
      name: "BOWTIE ncRNA Alignment"
      path_filters:
        - "*.out"
  - star:
      name: "STAR Genome Alignment"
      path_filters:
        - "*.final.out"
  - custom_content

custom_content:
  order:
    - software-versions-by-process
    - software-versions-unique

custom_data:
  mapping:
    description: "Read counts at each stage of mapping: ncRNA pre-mapping, genome mapping and unmapped reads, per sample."
  dedup_reads:
    description: "Input and output read counts across UMI deduplication, per sample."
  dedup_mean_umis:
    description: "Average number of UMIs per alignment position after deduplication, per sample."
  dedup_ratio:
    description: "Ratio of input to output reads across UMI deduplication, per sample."
  xlinks_counts:
    description: "Total crosslink events and unique crosslink sites detected, per sample/group."
  xlinks_ratio:
    description: "Crosslink events per unique crosslink site, per sample/group."
  total_peaks:
    description: "Number of peaks called by each peak caller, per sample/group."
  xlinks_in_peaks:
    description: "Percentage of crosslink events falling within called peaks, per peak caller."
  xlinksites_in_peaks:
    description: "Percentage of unique crosslink sites falling within called peaks, per peak caller."
  peaks_xlinksite_coverage:
    description: "Percentage of called peak width covered by crosslink sites, per peak caller."

# Customise the module search patterns to speed up execution time
sp:
  samtools/stats:
    fn: "*.stats"
  samtools/flagstat:
    fn: "*.flagstat"
  samtools/idxstats:
    fn: "*.idxstats*"
